[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-workflow-orchestration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic",
  "fastapi",
  "uvicorn[standard]",
  "asyncpg",
  "openai",
  "httpx",
  "jinja2",
  "minio",
  "pyyaml",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "httpx",
]

[project.scripts]
learning-workflow = "learning_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_pipeline", "src/learning_commissioning", "llm_gateway", "poc_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "api"]
