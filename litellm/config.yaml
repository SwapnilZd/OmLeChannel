general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_reset_budget: true
  disable_error_logs: true

router_settings:
  # Bound a slow provider attempt to 10 minutes and allow one retry. This keeps
  # unusually complex generations viable without letting one task wait for hours.
  timeout: 600
  num_retries: 1

litellm_settings:
  max_budget: 200
  budget_duration: os.environ/LITELLM_BUDGET_DURATION
  # All application model traffic already passes through this proxy. Exporting
  # here captures every provider/model consistently without per-call decorators.
  callbacks: ["langfuse_otel"]
