id: worked_example
name: Worked Example
description: >
  Presents a real-world scenario in a 2x2 grid covering: scenario, analysis,
  resolution, and key takeaway. Shows correct application of a concept in a
  realistic professional context.
when_to_use: >
  Use when the RLO provides a worked_example with scenario, analysis,
  resolution, and lesson fields. One screen per example. Shows how to
  apply a concept correctly in context.
tags: [example, application, scenario, mid-course]
sequence_position: middle
selection:
  category: practice
  purposes: [guided_application, worked_example]
  content_shapes: [scenario_analysis_resolution_lesson]
  relationships: [progressive_explanation]
  interactions: [stepper]
  densities: [balanced, text_heavy]
  sequence_positions: [middle]
  media_supported: true
  capacity: {min_items: 1, max_items: 1}
  retrieval_text: >
    Guided-practice slide for one worked example progressing through scenario, analysis,
    resolution, and lesson. Best for showing how a rule is applied in context with substantial
    explanatory text. Supports an optional illustration. Not for multiple unrelated examples.

slots:
  title:
    description: Example title
    target_chars: 50
    max_chars: 80
    required: true
  scenario:
    description: Brief setup of the situation. 1-3 sentences.
    target_chars: 100
    max_chars: 200
    required: true
  analysis:
    description: What is happening and why it matters. 1-3 sentences.
    target_chars: 100
    max_chars: 200
    required: true
  resolution:
    description: What the correct action or outcome is. 1-3 sentences.
    target_chars: 100
    max_chars: 200
    required: true
  lesson:
    description: The key takeaway. 1-2 sentences.
    target_chars: 80
    max_chars: 150
    required: true

image_slots:
  - id: illustration
    optional: true
    role: supporting_illustration
    generate: true
    fallback: theme_accent_block
