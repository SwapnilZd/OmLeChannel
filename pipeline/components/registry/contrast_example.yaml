id: contrast_example
name: Contrast Example
description: >
  Side-by-side comparison of an acceptable vs. unacceptable approach to a
  situation. Left column uses green styling, right column uses red styling.
  Clarifies where a boundary lies between correct and incorrect behaviour.
when_to_use: >
  Use when the RLO provides a contrast_example with acceptable and unacceptable
  sides. One screen per example. Best for clarifying grey-area boundaries.
tags: [example, contrast, comparison, mid-course]
sequence_position: middle
selection:
  category: content
  purposes: [clarify_boundary, contrast_correct_incorrect]
  content_shapes: [paired_examples]
  relationships: [contrast]
  interactions: []
  densities: [balanced, text_heavy]
  sequence_positions: [middle]
  media_supported: false
  capacity: {min_items: 2, max_items: 2}
  retrieval_text: >
    Two-sided content slide contrasting one acceptable and one unacceptable approach with the
    reason for each. Best for a precise boundary, counterexample, or correct-versus-incorrect
    distinction. Not for comparing more than two peers or showing an ordered process.

slots:
  title:
    description: Comparison title
    target_chars: 50
    max_chars: 80
    required: true
  acceptable:
    type: object
    slots:
      label:
        description: Column heading for the acceptable side
        target_chars: 30
        max_chars: 50
      description:
        description: Description of the acceptable approach. 1-3 sentences.
        target_chars: 100
        max_chars: 200
      reason:
        description: Why this approach is acceptable. 1-2 sentences.
        target_chars: 80
        max_chars: 150
  unacceptable:
    type: object
    slots:
      label:
        description: Column heading for the unacceptable side
        target_chars: 30
        max_chars: 50
      description:
        description: Description of the unacceptable approach. 1-3 sentences.
        target_chars: 100
        max_chars: 200
      reason:
        description: Why this approach is unacceptable. 1-2 sentences.
        target_chars: 80
        max_chars: 150

image_slots: []
