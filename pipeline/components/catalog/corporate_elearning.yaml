    suggested_family: relationship_diagram
    implementation: {status: ready, family: relationship_diagram, variant: matrix_2x2, notes: "Both axes and quadrant assignments must be source-grounded."}
    description: Positions items using two independent dimensions.
    when_to_use: Use only when both axes are meaningful and supplied by the source.
