version: 1
description: Searchable design inventory for corporate e-learning slide patterns.
concepts:
  # Intro and orientation
  - id: agenda_roadmap
    name: Agenda / Course Roadmap
    implementation_status: planned
    suggested_family: structured_list
    implementation: {status: ready, family: structured_list, variant: agenda, notes: "Supports two to eight ordered topics near the opening."}
    description: Ordered overview of modules or topics before instruction begins.
    when_to_use: Use when learners benefit from seeing the scope and sequence up front.
    selection: {category: intro, purposes: [preview_course, show_agenda], content_shapes: [ordered_topic_list], relationships: [ordered], interactions: [], densities: [sparse, balanced], sequence_positions: [intro], media_supported: false, capacity: {min_items: 2, max_items: 8}, retrieval_text: "Introductory roadmap for two to eight ordered modules or topics. Shows course scope and sequence without teaching the content."}
  - id: audience_relevance
    name: Why This Matters / WIIFM
    implementation_status: planned
    suggested_family: callout_focus
    description: Connects the learning topic to the learner's role, risk, or business outcome.
    when_to_use: Use near the opening when motivation or role relevance must be established.
    selection: {category: intro, purposes: [establish_relevance, motivate_learner], content_shapes: [single_message_with_evidence], relationships: [cause_effect], interactions: [], densities: [sparse, balanced], sequence_positions: [intro], media_supported: true, capacity: {min_items: 1, max_items: 3}, retrieval_text: "Opening relevance slide explaining why the topic matters to the learner, their role, a business outcome, or a risk. Supports one strong message and up to three evidence points."}
  - id: prerequisites_readiness
    name: Prerequisites / Before You Begin
    implementation_status: planned
    suggested_family: structured_list
    description: Lists required knowledge, access, materials, or preparation.
    when_to_use: Use before technical, procedural, or system training with prerequisites.
    selection: {category: intro, purposes: [confirm_readiness, list_prerequisites], content_shapes: [checklist], relationships: [requirements], interactions: [], densities: [sparse, balanced], sequence_positions: [intro], media_supported: false, capacity: {min_items: 1, max_items: 8}, retrieval_text: "Before-you-begin checklist for one to eight prerequisites such as prior knowledge, system access, materials, or preparation."}
  - id: navigation_tutorial
    name: How to Navigate
    implementation_status: planned
    suggested_family: labeled_diagram
    description: Explains course controls and interaction conventions.
    when_to_use: Use only when navigation or custom interactions are not self-evident.
    selection: {category: intro, purposes: [explain_navigation, orient_interface], content_shapes: [labeled_interface], relationships: [spatial], interactions: [hotspots], densities: [sparse], sequence_positions: [intro], media_supported: true, capacity: {min_items: 2, max_items: 8}, retrieval_text: "Interface orientation slide labeling two to eight navigation controls or interaction conventions. Best when the course player has unfamiliar controls."}
  - id: module_map
    name: Module Map
    implementation_status: planned
    suggested_family: navigation_hub
    description: Visual map of modules, dependencies, and current location.
    when_to_use: Use for multi-module programs with non-trivial structure.
    selection: {category: intro, purposes: [show_module_structure, locate_learner], content_shapes: [module_map], relationships: [hierarchy, dependency], interactions: [], densities: [balanced], sequence_positions: [intro, middle], media_supported: false, capacity: {min_items: 3, max_items: 12}, retrieval_text: "Visual map for three to twelve modules showing hierarchy, dependency, or current learner location in a larger program."}

  # Content presentation
  - id: text_image_explainer
    name: Text + Supporting Image
    implementation_status: planned
    suggested_family: split_content
    description: Explanatory prose paired with one meaningful visual.
    when_to_use: Use for one concept that benefits from contextual or illustrative imagery.
    selection: {category: content, purposes: [explain_concept, provide_context], content_shapes: [single_concept_with_visual], relationships: [single_focus], interactions: [], densities: [balanced, text_heavy], sequence_positions: [middle], media_supported: true, media_required: true, capacity: {min_items: 1, max_items: 1}, retrieval_text: "Content slide for one concept with moderate or substantial explanatory text beside one meaningful image. Not for decorative imagery or multiple peer concepts."}
  - id: icon_card_grid
    name: Icon Card Grid
    implementation_status: planned
    suggested_family: card_grid
    implementation: {status: ready, family: card_grid, variant: icon_cards, notes: "Uses concise peer items and optional supplied or generic icons."}
    description: Short peer concepts presented as equal cards with icons.
    when_to_use: Use for concise parallel categories that each have a recognizable icon.
    selection: {category: content, purposes: [introduce_categories, summarize_concepts], content_shapes: [peer_items], relationships: [parallel], interactions: [], densities: [sparse, balanced], sequence_positions: [middle], media_supported: true, capacity: {min_items: 2, max_items: 6}, retrieval_text: "Grid of two to six equal peer cards, each with an icon, short heading, and concise explanation. Best for visually scannable categories; not text-heavy definitions."}
  - id: image_card_grid
    name: Image Card Grid
    implementation_status: planned
    suggested_family: card_grid
    description: Peer items represented by thumbnail images and short captions.
    when_to_use: Use when each category has a distinct meaningful visual.
    selection: {category: content, purposes: [show_examples, compare_visual_categories], content_shapes: [image_caption_items], relationships: [parallel], interactions: [], densities: [sparse], sequence_positions: [middle], media_supported: true, media_required: true, capacity: {min_items: 2, max_items: 4}, retrieval_text: "Two to four peer image cards with meaningful thumbnails, headings, and short captions. Best for visually distinct examples or categories, not long text."}
  - id: statistic_dashboard
    name: Key Statistics Dashboard
    implementation_status: planned
    suggested_family: card_grid
    implementation: {status: ready, family: card_grid, variant: metric_cards, notes: "Supports two to six sourced metrics with concise interpretation."}
    description: Highlights several quantitative facts with labels and context.
    when_to_use: Use for two to six important metrics that support one message.
    selection: {category: content, purposes: [highlight_metrics, establish_scale], content_shapes: [metric_cards], relationships: [parallel], interactions: [], densities: [sparse, balanced], sequence_positions: [middle], media_supported: false, capacity: {min_items: 2, max_items: 6}, retrieval_text: "Dashboard of two to six key numbers or percentages, each with a label and concise interpretation. Best for establishing scale or evidence, not detailed data analysis."}
  - id: expert_quote
    name: Expert Quote / Leadership Voice
    implementation_status: planned
    suggested_family: callout_focus
    implementation: {status: ready, family: callout_focus, variant: expert_quote, notes: "Quotation and attribution must come from the source."}
    description: One sourced quotation with attribution and optional portrait.
    when_to_use: Use sparingly when an authoritative voice materially reinforces the message.
    selection: {category: content, purposes: [reinforce_authority, humanize_message], content_shapes: [quotation_with_attribution], relationships: [single_focus], interactions: [], densities: [sparse], sequence_positions: [middle], media_supported: true, capacity: {min_items: 1, max_items: 1}, retrieval_text: "Single sourced quotation with clear attribution and optional portrait. Best for a concise authoritative or leadership voice; never fabricate a quote."}
  - id: key_stat_callout
    name: Single Key Statistic
    implementation_status: planned
    suggested_family: callout_focus
    implementation: {status: ready, family: callout_focus, variant: key_stat, notes: "One sourced metric receives dominant emphasis."}
    description: One high-impact number with interpretation and source.
    when_to_use: Use when one quantitative fact deserves strong visual emphasis.
    selection: {category: content, purposes: [emphasize_statistic, establish_urgency], content_shapes: [single_metric_with_context], relationships: [single_focus], interactions: [], densities: [sparse], sequence_positions: [middle], media_supported: false, capacity: {min_items: 1, max_items: 1}, retrieval_text: "High-emphasis slide for one sourced number, percentage, or metric plus a short interpretation. Not a dashboard or chart."}
  - id: policy_callout
    name: Policy / Mandatory Requirement
    implementation_status: planned
    suggested_family: callout_focus
    implementation: {status: ready, family: callout_focus, variant: policy, notes: "Preserves mandatory source-authored language."}
    description: Visually distinguishes a mandatory policy statement from supporting explanation.
    when_to_use: Use for one source-authored requirement learners must recognize exactly.
    selection: {category: content, purposes: [state_policy, emphasize_requirement], content_shapes: [mandatory_statement_with_detail], relationships: [single_focus], interactions: [], densities: [balanced, text_heavy], sequence_positions: [middle], media_supported: false, capacity: {min_items: 1, max_items: 1}, retrieval_text: "Focused policy slide for one mandatory source-authored requirement with supporting explanation. Uses strong visual hierarchy without changing compliance language."}
  - id: warning_risk_callout
    name: Warning / Risk Callout
    implementation_status: planned
    suggested_family: callout_focus
    implementation: {status: ready, family: callout_focus, variant: warning, notes: "Designed for one critical risk and consequence."}
    description: Emphasizes one risk, consequence, or critical watch-out.
    when_to_use: Use when overlooking the point has a meaningful consequence.
    selection: {category: content, purposes: [highlight_risk, prevent_error], content_shapes: [warning_with_consequence], relationships: [cause_effect], interactions: [], densities: [sparse, balanced], sequence_positions: [middle], media_supported: false, capacity: {min_items: 1, max_items: 3}, retrieval_text: "Warning slide emphasizing one critical risk or up to three related watch-outs with consequences. Best for error prevention, not routine tips."}
  - id: accordion_content
    name: Accordion Detail
    implementation_status: planned
    suggested_family: disclosure_list
    implementation: {status: ready, family: disclosure_list, variant: accordion, notes: "Native accessible disclosures support three to eight sections."}
    description: Stacks expandable headings for several text-heavy peer topics.
    when_to_use: Use when five to eight categories need substantial optional detail.
    selection: {category: content, purposes: [explore_details, organize_reference], content_shapes: [peer_items], relationships: [parallel], interactions: [accordion, reveal], densities: [text_heavy], sequence_positions: [middle], media_supported: false, capacity: {min_items: 3, max_items: 8}, retrieval_text: "Expandable accordion for three to eight peer topics with substantial detail. Better than tabs when there are many headings or learners may compare opened sections vertically."}
  - id: faq_list
    name: Frequently Asked Questions
    implementation_status: planned
    suggested_family: disclosure_list
    implementation: {status: ready, family: disclosure_list, variant: faq, notes: "Use only for genuinely question-shaped source content."}
    description: Question-and-answer pairs presented as expandable reference content.
    when_to_use: Use when the source is genuinely organized around common learner questions.
    selection: {category: content, purposes: [answer_questions, provide_reference], content_shapes: [question_answer_pairs], relationships: [question_answer], interactions: [accordion, reveal], densities: [balanced, text_heavy], sequence_positions: [middle, end], media_supported: false, capacity: {min_items: 2, max_items: 8}, retrieval_text: "FAQ slide for two to eight grounded question-and-answer pairs, usually expandable. Best for learner-centered reference questions, not arbitrary headings rewritten as questions."}
  - id: before_after
    name: Before / After
    implementation_status: planned
    suggested_family: paired_comparison
    implementation: {status: ready, family: paired_comparison, variant: before_after, notes: "Requires exactly two corresponding source-grounded states."}
    description: Shows a change from current state to future state.
    when_to_use: Use for transformations with two directly corresponding states.
    selection: {category: content, purposes: [show_transformation, compare_states], content_shapes: [paired_states], relationships: [before_after], interactions: [], densities: [balanced, text_heavy], sequence_positions: [middle], media_supported: true, capacity: {min_items: 2, max_items: 2}, retrieval_text: "Two-state comparison showing before/current and after/future conditions with directly corresponding details. Supports text or paired visuals."}
  - id: pros_cons
    name: Pros / Cons
    implementation_status: planned
    suggested_family: paired_comparison
    implementation: {status: ready, family: paired_comparison, variant: pros_cons, notes: "Preserves neutral trade-off semantics."}
    description: Balances advantages and disadvantages of one option.
    when_to_use: Use when the source explicitly presents trade-offs rather than right and wrong.
    selection: {category: content, purposes: [explain_tradeoffs, evaluate_option], content_shapes: [two_sided_lists], relationships: [tradeoff], interactions: [], densities: [balanced], sequence_positions: [middle], media_supported: false, capacity: {min_items: 2, max_items: 10}, retrieval_text: "Balanced two-sided slide listing genuine advantages and disadvantages or benefits and limitations. Not for acceptable-versus-unacceptable compliance guidance."}
  - id: do_dont
    name: Do / Don't
    implementation_status: planned
    suggested_family: paired_comparison
    implementation: {status: ready, family: paired_comparison, variant: do_dont, notes: "Requires explicit recommended and discouraged behaviors."}
    description: Pairs recommended and discouraged behaviors.
    when_to_use: Use for practical behavioral guidance with clear action boundaries.
    selection: {category: content, purposes: [guide_behavior, prevent_errors], content_shapes: [paired_behavior_lists], relationships: [contrast], interactions: [], densities: [sparse, balanced], sequence_positions: [middle], media_supported: false, capacity: {min_items: 2, max_items: 10}, retrieval_text: "Practical two-column behavior guide pairing recommended actions with actions to avoid. Best for concise actionable guidance."}
  - id: operational_checklist
    name: Operational Checklist
    implementation_status: planned
    suggested_family: structured_list
    implementation: {status: ready, family: structured_list, variant: checklist, notes: "Use for independent checks rather than ordered steps."}
    description: Actionable list used during or after real work.
    when_to_use: Use for independent checks rather than ordered procedural steps.
    selection: {category: content, purposes: [support_performance, provide_checklist], content_shapes: [checklist], relationships: [independent], interactions: [], densities: [sparse, balanced], sequence_positions: [middle, end], media_supported: false, capacity: {min_items: 3, max_items: 10}, retrieval_text: "Performance-support checklist for three to ten independent actions or verification points. Order is not essential; suitable for later job use."}
  - id: cycle_diagram
    name: Cycle / Continuous Loop
    implementation_status: planned
    suggested_family: relationship_diagram
    implementation: {status: ready, family: relationship_diagram, variant: cycle, notes: "Source must explicitly establish a recurring loop."}
    description: Shows recurring stages without a terminal endpoint.
    when_to_use: Use when the process explicitly repeats or feeds back into itself.
    selection: {category: content, purposes: [show_cycle, explain_continuous_process], content_shapes: [cyclic_stages], relationships: [cyclic], interactions: [], densities: [sparse, balanced], sequence_positions: [middle], media_supported: false, capacity: {min_items: 3, max_items: 7}, retrieval_text: "Circular diagram for three to seven recurring stages where the final stage feeds the first. Not for a one-way process or unordered categories."}
  - id: hierarchy_pyramid
    name: Hierarchy / Pyramid
    implementation_status: planned
    suggested_family: relationship_diagram
    implementation: {status: ready, family: relationship_diagram, variant: hierarchy, notes: "Source must supply ranked, nested, or foundational levels."}
    description: Shows ranked, nested, or foundational levels.
