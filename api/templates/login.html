<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Omnichannel Learning</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#1a1d23;background:#f5f6f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem}
    main{width:min(100%,390px);background:#fff;border:1px solid #dde1e7;border-top:4px solid #86bc25;border-radius:8px;padding:2rem;box-shadow:0 12px 30px rgba(0,0,0,.08)}
    h1{font-size:1.45rem;margin:0 0 .4rem}p{color:#6b7280;margin:0 0 1.5rem;font-size:.9rem}
    label{display:grid;gap:.4rem;margin-top:1rem;font-size:.82rem;font-weight:700}input{width:100%;border:1px solid #b8bec8;border-radius:6px;padding:.7rem;font:inherit}
    button{width:100%;margin-top:1.4rem;border:0;border-radius:6px;padding:.75rem;background:#005587;color:#fff;font:700 .9rem system-ui;cursor:pointer}
    .error{color:#b91c1c;background:#fef2f2;border-radius:5px;padding:.7rem;margin:0 0 1rem;font-size:.82rem}
  </style>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<main class="login-shell">
  <div class="login-brand">
    <div class="brand-lockup" aria-label="Deloitte Omnichannel Learning">
      <img class="brand-logo" src="/static/brand/deloitte-logo-web.png" alt="Deloitte">
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="product-name">Omnichannel Learning</span>
    </div>
  </div>
  <div class="login-content">
    <h1>Welcome</h1>
    <p>Sign in to commission and review generated learning content.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Email<input type="email" name="email" value="{{ email }}" placeholder="name@deloitte.com" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
